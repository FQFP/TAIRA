QUERY_NUMBER: 200
TOPN_ITEMS: 500
TOPK_ITEMS: 10

# Select the recommendation domain.
# Available in the current repository: amazon_clothing, amazon_music
DOMAIN: "amazon_clothing"

# LLM model name is configured in config/api_config.yaml.
METHOD: "TAIRA"

# Search backend will be implemented as a separately configurable component.
SEARCH_MODE: "deepseek"

# Thought Pattern Distillation must be enabled for this project.
ENABLE_LEARNING: true
